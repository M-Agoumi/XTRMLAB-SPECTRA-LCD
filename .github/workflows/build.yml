name: Build

# main + a `v*.*.*` tag -> a production release (not a prerelease).
# develop -> a rolling "beta" prerelease, re-published on every push.
# A pull request (into develop OR main) only runs the test job -- no
# exe built, whichever branch it targets. This used to also build a
# preview exe for the develop -> main release PR specifically, but
# that PR is always opened from develop's tip, and pushing to develop
# already triggers its own `push` build for that exact commit -- so
# the PR build was doing the same Windows build+sign twice for nothing
# (confirmed by a real run: every push to develop while that PR was
# open fired both the `push` build AND a duplicate `pull_request`
# build). The already-published "beta-latest" release IS the pre-merge
# sanity check now: it's rebuilt fresh from develop's tip on every
# push, which is the exact commit the release PR is reviewing.
on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system deps for pycairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install Python test dependencies
        run: pip install pytest pyserial pillow numpy pycairo psutil

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: pytest tests/ -q

  build:
    needs: test
    # Runs for every push this workflow triggers on (develop, a
    # v*.*.* tag, workflow_dispatch) -- never for a pull_request,
    # whichever branch it targets. `needs: test` above already ran for
    # a PR, and that's all a PR gets now (see the header comment on
    # why the old develop -> main PR build was removed).
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "tag=beta-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the floating "beta" tag to this commit
        if: steps.channel.outputs.channel == 'beta'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta-latest
          git push -f origin beta-latest

      - name: Install Python dependencies
        # `python -m pip install`, not bare `pip install` -- the
        # windows-latest runner can have more than one Python on PATH,
        # and bare `pip` isn't guaranteed to be the same interpreter
        # `python` resolves to right after.
        #
        # `shell: bash`, not this job's default pwsh -- confirmed by a
        # real CI failure: requirements.txt's install genuinely failed
        # outright (an unsatisfiable winsdk constraint aborted the
        # whole file, taking playwright/pycaw/pythonnet/pystray/
        # pywebview down with it -- see requirements.txt's own comment
        # on that line for the fix), and this step still showed green.
        # pwsh doesn't fail a multi-line `run:` block just because one
        # of its lines exited non-zero (no bash-style `set -e`), so the
        # second line (`pip install pyinstaller`, which had nothing
        # wrong with it) running fine was enough to mark the whole step
        # a pass. GitHub Actions' bash steps run with `-e` on by
        # default, so the same silent-failure shape can't happen here
        # again.
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Playwright Chromium (webpage-mirror theme)
        # `playwright install chromium` (the bare console script) isn't
        # reliably on PATH in this same step right after `pip install`
        # on the windows-latest runner -- confirmed by a real CI run:
        # "The term 'playwright' is not recognized...". `python -m
        # playwright` resolves the installed module directly instead of
        # depending on pip's Scripts/ dir having been picked up by
        # PATH, so it doesn't have that problem.
        shell: bash
        run: python -m playwright install chromium

      - name: Build frontend
        working-directory: frontend
        # shell: bash for the same reason as "Install Python
        # dependencies" above -- pwsh's default multi-line `run:`
        # doesn't stop after `npm ci` fails, so a broken `npm ci` could
        # let `npm run build` run against a half-installed
        # node_modules and still show the step as green.
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build the exe with PyInstaller
        run: pyinstaller packaging/hongtai_screen.spec

      - name: Sign the exe (SignPath)
        # Uses SignPath's "CI Beta Signing" policy, currently backed by
        # a self-signed TEST certificate (see BUILD.md's Smart App
        # Control note -- a self-signed cert doesn't get SmartScreen/
        # Smart App Control to actually trust the exe, this just proves
        # the CI -> SignPath pipeline itself works end to end). Swap
        # -SigningPolicySlug to a real release policy once SignPath's
        # free OSS program issues an actual trusted certificate.
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force
          # -OutputArtifactPath must NOT be the same file as -InputArtifactPath --
          # Submit-SigningRequest downloads the signed result to the output path
          # and refuses to overwrite an existing file there without -Force, and
          # that "existing file" would be the unsigned input it just read (real
          # CI failure: "There is already a file at ...dist\Hongtai Screen.exe.
          # If you want to overwrite it use the -Force switch"). Signing to a
          # separate temp path and then replacing the original avoids relying on
          # -Force to blow away the unsigned exe mid-request.
          Submit-SigningRequest `
            -InputArtifactPath "dist\Hongtai Screen.exe" `
            -ApiToken $env:SIGNPATH_API_TOKEN `
            -OrganizationId "cd586646-a92e-463e-9b22-9fc099baa11c" `
            -ProjectSlug "Hongtai_Screen" `
            -SigningPolicySlug "CI_Beta_Signing" `
            -OutputArtifactPath "dist\Hongtai Screen.signed.exe" `
            -WaitForCompletion
          Move-Item -Path "dist\Hongtai Screen.signed.exe" -Destination "dist\Hongtai Screen.exe" -Force

      - name: Delete previous beta release
        # GitHub's "immutable releases" now refuse to let an action
        # delete/replace an ASSET on an already-published release
        # (real CI failure: "Cannot delete asset from an immutable
        # release" -- softprops/action-gh-release hit this trying to
        # swap out the old exe on the rolling "beta" release, which
        # every push to develop republishes at the same tag). Deleting
        # the whole release (and its tag) is still allowed, so do that
        # first and let the next step create a fresh one -- the moved
        # "beta" tag from the earlier step still points at this commit
        # either way.
        if: steps.channel.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete beta-latest --yes --cleanup-tag=false || true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.channel == 'prod' && format('Hongtai Screen {0}', steps.channel.outputs.tag) || 'Beta build' }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          make_latest: ${{ steps.channel.outputs.channel == 'prod' }}
          files: "dist/Hongtai Screen.exe"
          body: ${{ steps.channel.outputs.channel == 'beta' && format('Automatic beta build from `develop` @ `{0}`.', github.sha) || format('Production release built from tag `{0}`.', steps.channel.outputs.tag) }}
